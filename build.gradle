plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'com.alsaadii98'
version = '0.0.1'

repositories {
    mavenCentral()
}

dependencies {
    // JSON Parsing
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    implementation 'io.jsonwebtoken:jjwt-impl:0.13.0'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    // Spring Auto Configuration
    implementation 'org.springframework.boot:spring-boot-autoconfigure:3.5.4'
    compileOnly 'org.springframework.boot:spring-boot-configuration-processor:3.5.4'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor:3.5.4'
    // Testing
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
}

tasks.named('jar') {
    enabled = false
}

shadowJar {
    archiveClassifier = ''
    archiveBaseName = 'zaincash-sdk'

    mergeServiceFiles()

    relocate 'io.jsonwebtoken', 'com.alsaadii98.zaincash.sdk.libs.jjwt'
    relocate 'com.fasterxml.jackson', 'com.alsaadii98.zaincash.sdk.libs.jackson'

    dependencies {
        include(dependency('io.jsonwebtoken:jjwt-api:.*'))
        include(dependency('io.jsonwebtoken:jjwt-impl:.*'))
        include(dependency('io.jsonwebtoken:jjwt-jackson:.*'))
        include(dependency('com.fasterxml.jackson.core:jackson-databind:.*'))
    }

    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

tasks.named('build') {
    dependsOn(tasks.named('shadowJar'))
}

publishing {
    publications {
        shadow(MavenPublication) {
            artifact shadowJar
            artifact sourcesJar

            groupId = 'com.alsaadii98'
            artifactId = 'zaincash-sdk'
            version = "${project.version}"


            pom.withXml {
                def node = asNode()
                def dependenciesNode = node.get('dependencies')
                if (dependenciesNode) {
                    node.remove(dependenciesNode)
                }
            }

            pom {
                name = 'ZainCash Java SDK'
                description = 'Java SDK for ZainCash payment integration - Self-contained with shaded dependencies'
                url = 'https://github.com/esiteltd/java-zaincash-sdk'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'alsaadii98'
                        name = 'Ali Hassan Abdulhadi'
                        email = 'a.h.alsaady1998@gmail.com'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/esiteltd/java-zaincash-sdk.git'
                    developerConnection = 'scm:git:ssh://github.com/esiteltd/java-zaincash-sdk.git'
                    url = 'https://github.com/esiteltd/java-zaincash-sdk'
                }
            }
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/esiteltd/java-zaincash-sdk"
            credentials {
                username = System.getenv("GITHUB_USERNAME")
                password = System.getenv("GITHUB_PACKAGE_TOKEN_ORG")
            }
        }
    }
}

tasks.named('publishShadowPublicationToGitHubPackagesRepository') {
}

tasks.register('publishSdk') {
    dependsOn 'publishShadowPublicationToGitHubPackagesRepository'
    doLast {
        println "🚀 Successfully published com.alsaadii98:zaincash-sdk:0.1.1"
    }
}